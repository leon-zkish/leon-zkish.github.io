		background: radial-gradient(circle at center, rgba(107,0,161,.8), transparent 60%);

		filter: blur(100px);
		animation: heartbeat 3.2s infinite;
	}

	@keyframes heartbeat {
		0%, 80% {opacity: 0; transform: scale(1);}
		84% {opacity: .9; transform: scale(1.08);}
		87% {opacity: 0; transform: scale(1);}
		90% {opacity: 1; transform: scale(1.15);}
		94% {opacity: 0; transform: scale(1.25);}
		100% {opacity: 0; transform: scale(1);}
	}

	a:link {  color: red;}
	a:visited {  color: #b40000;}

	<script>
	function goToPage() {
		const page = document.getElementById("frameworks").value;
		if (page) {
			window.location.href = page;
		}}
	<!-- This makes the sound work -->
	const audio = document.getElementById("bgmusic");
	const sw = document.getElementById("MusicSwitch");
	sw.addEventListener("change", async () => {
		if (sw.checked) {
			try {
				await audio.play();
			} catch (err) {
				console.error("No se pudo reproducir el audio:", err);
				sw.checked = false;
			}
		} else {
			audio.pause();
		}
	});
	</script>
