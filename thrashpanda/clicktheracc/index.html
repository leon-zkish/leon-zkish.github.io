<!DOCTYPE html>
<html>

<!-- HeaderStart -->
  <head>
  
    <title>THRASH PANDA</title>
	<link rel="icon" type="image/x-icon" href="https://leon-zkish.github.io/RACC.png">
  </head>  
  <body style="background-color:black;">
	<center><img src="https://leon-zkish.github.io/tptxt.png" alt="THRASH PANDA, ALWAYS LITTERING" style="width: 384px; min-width: 384px;"></center>
	<!-- HeaderEnd -->
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        /* 80% screen width, 64% screen height, 2px border */
        #game-box {
            width: 80vw;
            height: 64vh;
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
            background: #000;
        }
		#game-box.blurred .racc {
		filter: blur(2px);
		transition: filter 0.3s ease;
		}
        .racc {
            position: absolute;
            width: 60px;
            height: 60px;
            cursor: pointer;
            object-fit: contain;
        }
        #ui-container {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
			transition: filter 0.3s ease;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            font-family: Consolas, monospace;
            font-size: 18px;
            padding: 8px 16px;
            margin-top: 15px;
            cursor: pointer;
            background: #fff;
            color: #000;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background: #ccc;
        }
    </style>
</head>
<body>

    <!-- GAME BOX (80vw x 64vh) -->
    <div id="game-box">
        <div id="overlay">
            <center>
			<p id="msg" style="color: white; font-size: 1.6em;"><font face="Consolas">CLICK THE RACC</font></p>
			<br>
            <button onclick="startGame()">START</button>
			</center>
        </div>
    </div>
    <div id="ui-container">
        <div>Raccs clicked: <span id="score">0</span></div>
        <div>Most raccs clicked: <span id="highscore">0</span></div>
    </div>
    <script>
        const box = document.getElementById('game-box');
        const overlay = document.getElementById('overlay');
        const msg = document.getElementById('msg');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highscore');
        let score = 0;
        let highScore = parseInt(localStorage.getItem('racchs') || '0', 10);
        let raccs = [];
        let X = 1;
        let isPlaying = false;
        let lastClickTime = 0;
        let spawnTimer = null;
        let speedTimer = null;
        let animId = null;
        highScoreEl.textContent = highScore;
        const fallbackSrc = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦝</text></svg>";
        function startGame() {
            score = 0;
            X = 1;
            scoreEl.textContent = score;
            raccs.forEach(r => r.img.remove());
            raccs = [];
            isPlaying = true;
            overlay.style.display = 'none';
            lastClickTime = Date.now();
            clearInterval(spawnTimer);
            clearInterval(speedTimer);
            speedTimer = setInterval(() => { X += 0.05; }, 500);
            spawnTimer = setInterval(() => {
                if (raccs.length < 8) spawn();
            }, 2500);
            spawn();
            if (animId) cancelAnimationFrame(animId);
			box.classList.remove('blurred');
            loop();
        }
        function gameOver()
		{
            isPlaying = false;
            clearInterval(spawnTimer);
            clearInterval(speedTimer);
            cancelAnimationFrame(animId);
            if (score > highScore)
			{
                highScore = score;
                localStorage.setItem('racchs', highScore);
                highScoreEl.textContent = highScore;
            }
            msg.textContent = msg.innerHTML = "Game over, try again?";
            overlay.style.display = 'flex';
			box.classList.add('blurred');
        }
        function spawn()
		{
            if (raccs.length >= 8 || !isPlaying) return;
            const img = document.createElement('img');
            img.src = 'clicktheracc1.png';
            img.onerror = () => { img.src = fallbackSrc; };
            img.className = 'racc';
			
            const bw = box.clientWidth;
            const bh = box.clientHeight;
            let x = Math.random() * (bw - 60);
            let y = Math.random() * (bh - 60);
            const angle = Math.random() * Math.PI * 2;
            const baseSpeed = 1.5;
            let dx = Math.cos(angle) * baseSpeed;
            let dy = Math.sin(angle) * baseSpeed;
            const racc = { img, x, y, dx, dy };
            img.onpointerdown = (e) =>
			{
                e.stopPropagation();
                if (!isPlaying) return;
                img.remove();
                raccs = raccs.filter(r => r !== racc);
                score++;
                scoreEl.textContent = score;
                lastClickTime = Date.now();
                if (raccs.length === 0) spawn();
            };
            box.appendChild(img);
            raccs.push(racc);
		}
        function loop()
		{
            if (!isPlaying) return;
            if (Date.now() - lastClickTime > 8000) 
			{
                gameOver();
                return;
            }
            const bw = box.clientWidth;
            const bh = box.clientHeight;
            // DVD bounce
            raccs.forEach(r =>
			{
                r.x += r.dx * X;
                r.y += r.dy * X;
                if (r.x <= 0) {r.x=0; r.dx = Math.abs(r.dx);}
					else if (r.x>=bw-60) {r.x = bw - 60; r.dx = -Math.abs(r.dx);}
                if (r.y <= 0) {r.y=0; r.dy=Math.abs(r.dy);}
					else if (r.y >= bh - 60) {r.y = bh - 60; r.dy = -Math.abs(r.dy);}
                r.img.style.left=r.x+'px';	r.img.style.top=r.y+'px';
            });
            animId = requestAnimationFrame(loop);
        }
    </script>
</body>
